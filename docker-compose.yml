
name: what2cook

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - what2cook_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: what2cook-server:latest
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/What2Cook
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    image: what2cook-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8081:80"

volumes:
  what2cook_mongo_data:
